apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wheat-mlops
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: wheat-api
        metrics_path: /metrics
        scrape_interval: 10s
        scrape_timeout: 5s
        static_configs:
          - targets: ["wheat-api.wheat-mlops.svc:80"]

  alert_rules.yml: |
    groups:
      - name: wheat_api_alerts
        rules:
          - alert: WheatApiHighP95Latency
            expr: histogram_quantile(0.95, sum by (le, endpoint) (rate(wheat_api_request_duration_seconds_bucket[5m]))) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Wheat API p95 latency is above 500ms"
              description: "Endpoint {{ $labels.endpoint }} p95 latency is {{ $value }}s over the last 5 minutes."

          - alert: WheatApiHighErrorRate
            expr: (sum(rate(wheat_api_errors_total[5m])) / clamp_min(sum(rate(wheat_api_requests_total[5m])), 0.0001)) * 100 > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Wheat API error rate exceeds 5%"
              description: "Error rate is {{ $value }}% over the last 5 minutes."

          - alert: WheatApiDown
            expr: up{job="wheat-api"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Wheat API instance is unreachable"
              description: "Scrape target wheat-api.wheat-mlops.svc:80 is reporting down."
