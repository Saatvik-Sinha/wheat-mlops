[project]
name = "wheat-mlops"
version = "0.1.0"
description = "A demonstration of various MlOps tooling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaggle>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "ultralytics>=8.3,<9",
]

[build-system]
requires = ["uv_build<=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/python"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.uvicorn]
factory = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "kaggle>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyngrok>=9.1.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "scikit-learn>=1.3",
    "ultralytics>=8.3,<9",
    "xonsh[full]>=0.25.0",
]
