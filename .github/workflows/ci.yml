# Pipeline A CI/CD (Part 6A): lint -> test -> docker build check -> deploy frontend to GH Pages.
# Pipeline B does the same lint/test stages with Jenkins (see Jenkinsfile on pipeline-b).
name: CI/CD (pipeline-a)

on:
  push:
    branches: [pipeline-a]
  pull_request:
    branches: [pipeline-a]
  workflow_dispatch:

# Only one Pages deployment at a time; a newer push cancels older in-progress CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  RUFF_VERSION: "0.17.2" # keep in sync with uv.lock

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff@${{ env.RUFF_VERSION }} check . --output-format=github
      - name: ruff format --check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            requirements-serve.txt

      # uv.lock pins CUDA torch (~3 GB of nvidia-* wheels). The tests never import torch,
      # so install CPU-only wheels instead -- same trick as docker/Dockerfile.
      - name: Install dependencies (CPU-only torch)
        run: |
          uv venv
          uv export --frozen --all-groups --no-hashes --no-emit-project -o requirements.txt
          grep -vE '^(nvidia-|triton)' requirements.txt > requirements.cpu.txt
          uv pip install -r requirements.cpu.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match
          uv pip install -r requirements-serve.txt httpx
          uv pip install --no-deps -e .

      # --no-sync stops uv from re-syncing the venv to uv.lock (which would pull CUDA again).
      - name: pytest
        run: uv run --no-sync pytest -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build wheat-mlops image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: wheat-mlops:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    # Deploy only from the protected pipeline branch, never from PRs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/pipeline-a'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
